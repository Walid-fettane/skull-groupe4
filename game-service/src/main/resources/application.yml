spring:
  application:
    name: game-service
  datasource:
    url: jdbc:sqlite:${SKULL_DB_PATH:db/database.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

server:
  port: 8082

skull:
  ladder-service:
    url: ${SKULL_LADDER_URL:http://localhost:8083}
